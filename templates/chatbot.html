<!-- chatbot.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>

<body>
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Ask About Animals To Our Zoologist! ❤️</a>
    </div>

    <div class="chatbot">
        <div class="querybox">
            <form class="user-message" action="/chat" method="post">
                <textarea class="text-area" name="user_message" placeholder="Type your question here..."
                    required></textarea>
                <br>
                <button type="submit" class="chatbot-button">Send</button>
            </form>
        </div>

        <div class="message-box">
            {% if user_message %}
            <p><b>You:</b> {{ user_message }}</p>
            <textarea class="output-response" id="bot_response" rows="3">{{ bot_response }}</textarea>
            {% else %}
            <p><i>Hi! How can I help you today?</i></p>
            {% endif %}
        </div>
    </div>
</body>

</html>
